name: Test Jekyll with GitHub Pages
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inject URLs
        env:
          BASE_URL: ""
          RESUME_URL: ${{ secrets.RESUME_URL }}
          CONTACT_URL: ${{ secrets.CONTACT_URL }}
        run: |
          touch src/_config.yml
          yq eval ".baseurl = strenv(BASE_URL)" -i src/_config.yml
          yq eval ".resume_url = strenv(RESUME_URL)" -i src/_config.yml
          yq eval ".contact_url = strenv(CONTACT_URL)" -i src/_config.yml
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: src
          destination: _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
